<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gincana Animal Crossing - Canela</title>
    <style>
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2');
            font-weight: bold;
        }

        * { box-sizing: border-box; }

        body { 
            background: #a9e08f; 
            background-image: radial-gradient(rgba(0,0,0,0.1) 20%, transparent 20%);
            background-size: 30px 30px;
            font-family: 'Seurat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
        }

        #character-img {
            width: 65vw; 
            max-width: 280px;
            height: auto;
            z-index: 30;
            margin-bottom: -40px; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }

        #btn-abrir {
            background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a;
            font-family: 'Seurat', sans-serif;
        }

        #dialog-container {
            width: 90%; 
            max-width: 600px; 
            height: 180px; 
            background: #fffdf0; 
            border: 6px solid #f3e5ab; 
            border-radius: 40px;
            padding: 30px 35px; 
            position: relative; 
            box-shadow: 0 8px 0 #d9c9a0; 
            cursor: pointer; 
            display: none;
            z-index: 20;
        }

        #name-tag {
            position: absolute; 
            top: -20px; left: 30px; 
            background: #f7a8b8; 
            color: white; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 1.1rem;
            border: 3px solid #fff;
            z-index: 40;
            font-family: 'Seurat', sans-serif;
        }

        #text { 
            color: #5d4a37; 
            font-family: 'Seurat', sans-serif;
            font-weight: bold;
            font-size: clamp(1.1rem, 4vw, 1.3rem); 
            line-height: 1.3; 
            overflow: hidden;
            height: 100%;
        }

        #btn-reiniciar {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: #f7a8b8;
            border: 3px solid #fff; 
            color: white;
            padding: 8px 15px; 
            border-radius: 25px; 
            font-size: 0.9rem;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #d68a9a;
            z-index: 50;
            font-family: 'Seurat', sans-serif;
        }

        #arrow { 
            position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-top: 15px solid #a9e08f; animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }
    </style>
</head>
<body onclick="handleGlobalClick()">
    <img id="character-img" src="https://dodo.ac/np/images/f/f5/Isabelle_NH_Transparent.png" alt="Personaje">
    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">¡Hay una nota de Canela!</button>
    </div>
    <div id="dialog-container">
        <div id="name-tag">Canela</div> 
        <div id="text"></div>
        <button id="btn-reiniciar" onclick="reiniciarGincana(event)">Reiniciar</button>
        <div id="arrow" style="display:none"></div>
    </div>
    <audio id="voice-sound" src="animalese.wav" loop></audio>
    <script>
        const messages = [
            "¡Excelente! Ya tienes el transporte oficial de la isla.",
            "Con este bote podrás cruzar los ríos y llegar a los rincones más lejanos.",
            "Me informan por el pinganillo de que una jovencita muy alegre ha montado un campamento base...",
            "Dicen que buscaba un lugar alto, con mucha luz y aire fresco. ¡Deberías dirigirte hacia allá!",
            "¡Sigue el rastro de la aventura!"
        ];
        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;
        const textDiv = document.getElementById("text");
        const restartBtn = document.getElementById("btn-reiniciar");
        const arrow = document.getElementById("arrow");
        function empezarJuego(event) {
            event.stopPropagation(); 
            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            startMessage();
        }
        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].length;
                textDiv.innerHTML = messages[currentMsgIndex];
                stopVoice();
            } else {
                if (currentMsgIndex < messages.length - 1) {
                    currentMsgIndex++;
                    startMessage();
                }
            }
        }
        function startMessage() {
            isTyping = true;
            charIndex = 0;
            textDiv.innerHTML = "";
            restartBtn.style.display = "none";
            arrow.style.display = "none";
            document.getElementById("voice-sound").play();
            typeWriter();
        }
        function typeWriter() {
            if (charIndex < messages[currentMsgIndex].length) {
                textDiv.innerHTML += messages[currentMsgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 40);
            } else {
                stopVoice();
            }
        }
        function stopVoice() {
            isTyping = false;
            document.getElementById("voice-sound").pause();
            document.getElementById("voice-sound").currentTime = 0;
            if (currentMsgIndex < messages.length - 1) {
                arrow.style.display = "block";
            } else {
                restartBtn.style.display = "block";
            }
        }
        function reiniciarGincana(event) {
            event.stopPropagation(); 
            currentMsgIndex = 0;
            restartBtn.style.display = "none";
            startMessage();
        }
    </script>
<audio id="global-bgm" src="pista1.mp3" loop></audio>

<script>
    (function() {
        const bgm = document.getElementById('global-bgm');
        bgm.volume = 0.3; // Volumen de la música de fondo (0.0 a 1.0)

        // Función para iniciar la música con el primer clic del usuario (exigencia de navegadores)
        document.addEventListener('click', () => {
            if (bgm.paused) bgm.play();
        }, { once: true });

        // Monitor de audios
        setInterval(() => {
            const allAudios = document.querySelectorAll('audio:not(#global-bgm)');
            let specialAudioPlaying = false;

            allAudios.forEach(audio => {
                // Si el audio está sonando y NO es el balbuceo (animalese/voice)
                // Ajusta los nombres de archivo según tus .wav
                const isAnimalese = audio.src.includes('animalese') || 
                                    audio.id.includes('voice') || 
                                    audio.src.includes('gandulio.wav') || 
                                    audio.src.includes('encina.wav');

                if (!audio.paused && !isAnimalese) {
                    specialAudioPlaying = true;
                }
            });

            if (specialAudioPlaying) {
                // Si suena algo importante (música de misterio, etc), pausamos el fondo
                if (!bgm.paused) {
                    bgm.pause();
                }
            } else {
                // Si no hay audios especiales, el fondo sigue sonando
                if (bgm.paused && document.getElementById('overlay').style.display === 'none') {
                    bgm.play();
                }
            }
        }, 300); // Revisa cada 300ms
    })();
</script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
    /* BOTÓN "ESCANEAR QR" - ESTILO ANIMAL CROSSING */
    #ac-qr-trigger-btn {
        position: fixed;
        bottom: 20%;
        left: 50%;
        transform: translateX(-50%);
        background: #84c042; /* Verde bayas */
        border: 4px solid #fff;
        color: white;
        padding: 18px 35px;
        border-radius: 50px;
        font-family: 'Seurat', sans-serif;
        font-size: 1.4rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 6px 0 #618e31;
        z-index: 9999;
        display: none; /* Se activa automáticamente al final */
        animation: pulseButton 2s infinite;
    }

    @keyframes pulseButton {
        0% { transform: translateX(-50%) scale(1); }
        50% { transform: translateX(-50%) scale(1.05); }
        100% { transform: translateX(-50%) scale(1); }
    }

    /* OVERLAY DEL NOOKÓFONO */
    #nook-scanner-box {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #6D8B55; /* Verde Nookófono */
        z-index: 10000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Seurat', sans-serif;
    }

    #nook-camera-view {
        width: 85%;
        max-width: 350px;
        aspect-ratio: 9/12;
        border: 12px solid #E8D595; /* Marco crema */
        border-radius: 40px;
        background: #000;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0,0,0,0.4);
    }

    #nook-video { width: 100%; height: 100%; object-fit: cover; }

    #nook-target {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: 200px; height: 200px;
        border: 3px dashed #FFD700;
        border-radius: 20px;
        background: rgba(255, 215, 0, 0.05);
    }

    #nook-close-btn {
        margin-top: 30px;
        background: #ff7e7e;
        border: 3px solid #fff;
        color: white;
        padding: 12px 30px;
        border-radius: 30px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 0 #c05050;
    }
</style>

<button id="ac-qr-trigger-btn">📱 Escanear siguiente QR</button>

<div id="nook-scanner-box">
    <h2 style="color:white; text-shadow: 2px 2px 0 #4e633d; margin-bottom: 20px;">MODO ESCÁNER</h2>
    <div id="nook-camera-view">
        <video id="nook-video" playsinline></video>
        <div id="nook-target"></div>
    </div>
    <button id="nook-close-btn">CANCELAR</button>
</div>

<script>
    (function() {
        const triggerBtn = document.getElementById('ac-qr-trigger-btn');
        const scannerBox = document.getElementById('nook-scanner-box');
        const video = document.getElementById('nook-video');
        const closeBtn = document.getElementById('nook-close-btn');
        let stream = null;

        // --- DETECTOR UNIVERSAL PARA PISTAS (Ej: Coni, Gandulio, Encina) ---
        function checkEndOfConversation() {
            // Buscamos el botón de reiniciar que aparece al final de tus archivos
            const restartBtn = document.getElementById('btn-reiniciar');
            
            if (restartBtn && window.getComputedStyle(restartBtn).display !== 'none') {
                // Si el botón de reiniciar aparece, es que el diálogo ha terminado
                setTimeout(() => {
                    // 1. Ocultamos el botón de reiniciar original para que no estorbe
                    restartBtn.style.display = 'none';
                    
                    // 2. Desvanecemos al personaje y el cuadro (estilo limpio)
                    const charImg = document.getElementById('character-img');
                    const diagCont = document.getElementById('dialog-container');
                    if(charImg) charImg.style.transition = 'opacity 0.8s';
                    if(diagCont) diagCont.style.transition = 'opacity 0.8s';
                    
                    if(charImg) charImg.style.opacity = '0';
                    if(diagCont) diagCont.style.opacity = '0';
                    
                    // 3. Mostramos el botón del Nookófono
                    setTimeout(() => {
                        if(charImg) charImg.style.display = 'none';
                        if(diagCont) diagCont.style.display = 'none';
                        triggerBtn.style.display = 'block';
                    }, 800);
                }, 500);
            } else {
                // Seguimos comprobando mientras el usuario lee
                requestAnimationFrame(checkEndOfConversation);
            }
        }

        // Iniciamos la vigilancia del fin del diálogo
        checkEndOfConversation();

        // --- LÓGICA DE APERTURA DE CÁMARA ---
        triggerBtn.onclick = async () => {
            scannerBox.style.display = 'flex';
            try {
                // Intentamos capturar la cámara trasera
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                video.setAttribute("playsinline", true); // Crucial para iPhone
                video.play();
                requestAnimationFrame(scanTick);
            } catch (err) {
                alert("¡Upsi! El Nookófono necesita permiso para la cámara. Asegúrate de estar en HTTPS y aceptar los permisos.");
                scannerBox.style.display = 'none';
            }
        };

        // --- CERRAR ESCÁNER ---
        closeBtn.onclick = () => {
            if(stream) stream.getTracks().forEach(t => t.stop());
            scannerBox.style.display = 'none';
        };

        // --- ESCANEO EN TIEMPO REAL ---
        function scanTick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scannerBox.style.display === 'flex') {
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code && code.data.startsWith('http')) {
                    // Si encuentra un QR con link, vamos allá
                    triggerBtn.innerText = "¡LINK DETECTADO!";
                    if(stream) stream.getTracks().forEach(t => t.stop());
                    window.location.href = code.data;
                    return;
                }
            }
            requestAnimationFrame(scanTick);
        }
    })();
</script>
</body>
</html>
