<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gincana Animal Crossing - Canela</title>
    <style>
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2');
            font-weight: bold;
        }

        * { box-sizing: border-box; }

        body { 
            background: #a9e08f; 
            background-image: radial-gradient(rgba(0,0,0,0.1) 20%, transparent 20%);
            background-size: 30px 30px;
            font-family: 'Seurat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
        }

        #character-img {
            width: 65vw; 
            max-width: 280px;
            height: auto;
            z-index: 30;
            margin-bottom: -40px; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }

        #btn-abrir {
            background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a;
            font-family: 'Seurat', sans-serif;
        }

        #dialog-container {
            width: 90%; 
            max-width: 600px; 
            height: 180px; 
            background: #fffdf0; 
            border: 6px solid #f3e5ab; 
            border-radius: 40px;
            padding: 30px 35px; 
            position: relative; 
            box-shadow: 0 8px 0 #d9c9a0; 
            cursor: pointer; 
            display: none;
            z-index: 20;
        }

        #name-tag {
            position: absolute; 
            top: -20px; left: 30px; 
            background: #f7a8b8; 
            color: white; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 1.1rem;
            border: 3px solid #fff;
            z-index: 40;
            font-family: 'Seurat', sans-serif;
        }

        #text { 
            color: #5d4a37; 
            font-family: 'Seurat', sans-serif;
            font-weight: bold;
            font-size: clamp(1.1rem, 4vw, 1.3rem); 
            line-height: 1.3; 
            overflow: hidden;
            height: 100%;
        }

        #btn-reiniciar {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: #f7a8b8;
            border: 3px solid #fff; 
            color: white;
            padding: 8px 15px; 
            border-radius: 25px; 
            font-size: 0.9rem;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #d68a9a;
            z-index: 50;
            font-family: 'Seurat', sans-serif;
        }

        #arrow { 
            position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-top: 15px solid #a9e08f; animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }
    </style>
</head>
<body onclick="handleGlobalClick()">
    <img id="character-img" src="https://dodo.ac/np/images/f/f5/Isabelle_NH_Transparent.png" alt="Personaje">
    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">¡Hay una nota de Canela!</button>
    </div>
    <div id="dialog-container">
        <div id="name-tag">Canela</div> 
        <div id="text"></div>
        <button id="btn-reiniciar" onclick="reiniciarGincana(event)">Reiniciar</button>
        <div id="arrow" style="display:none"></div>
    </div>
    <audio id="voice-sound" src="animalese.wav" loop></audio>
    <script>
        const messages = [
            "¡Excelente! Ya tienes el transporte oficial de la isla.",
            "Con este bote podrás cruzar los ríos y llegar a los rincones más lejanos.",
            "Me informan por el pinganillo de que una jovencita muy alegre ha montado un campamento base...",
            "Dicen que buscaba un lugar alto, con mucha luz y aire fresco. ¡Deberías dirigirte hacia allá!",
            "¡Sigue el rastro de la aventura!"
        ];
        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;
        const textDiv = document.getElementById("text");
        const restartBtn = document.getElementById("btn-reiniciar");
        const arrow = document.getElementById("arrow");
        function empezarJuego(event) {
            event.stopPropagation(); 
            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            startMessage();
        }
        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].length;
                textDiv.innerHTML = messages[currentMsgIndex];
                stopVoice();
            } else {
                if (currentMsgIndex < messages.length - 1) {
                    currentMsgIndex++;
                    startMessage();
                }
            }
        }
        function startMessage() {
            isTyping = true;
            charIndex = 0;
            textDiv.innerHTML = "";
            restartBtn.style.display = "none";
            arrow.style.display = "none";
            document.getElementById("voice-sound").play();
            typeWriter();
        }
        function typeWriter() {
            if (charIndex < messages[currentMsgIndex].length) {
                textDiv.innerHTML += messages[currentMsgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 40);
            } else {
                stopVoice();
            }
        }
        function stopVoice() {
            isTyping = false;
            document.getElementById("voice-sound").pause();
            document.getElementById("voice-sound").currentTime = 0;
            if (currentMsgIndex < messages.length - 1) {
                arrow.style.display = "block";
            } else {
                restartBtn.style.display = "block";
            }
        }
        function reiniciarGincana(event) {
            event.stopPropagation(); 
            currentMsgIndex = 0;
            restartBtn.style.display = "none";
            startMessage();
        }
    </script>
<audio id="global-bgm" src="pista1.mp3" loop></audio>

<script>
    (function() {
        const bgm = document.getElementById('global-bgm');
        bgm.volume = 0.3; // Volumen de la música de fondo (0.0 a 1.0)

        // Función para iniciar la música con el primer clic del usuario (exigencia de navegadores)
        document.addEventListener('click', () => {
            if (bgm.paused) bgm.play();
        }, { once: true });

        // Monitor de audios
        setInterval(() => {
            const allAudios = document.querySelectorAll('audio:not(#global-bgm)');
            let specialAudioPlaying = false;

            allAudios.forEach(audio => {
                // Si el audio está sonando y NO es el balbuceo (animalese/voice)
                // Ajusta los nombres de archivo según tus .wav
                const isAnimalese = audio.src.includes('animalese') || 
                                    audio.id.includes('voice') || 
                                    audio.src.includes('gandulio.wav') || 
                                    audio.src.includes('encina.wav');

                if (!audio.paused && !isAnimalese) {
                    specialAudioPlaying = true;
                }
            });

            if (specialAudioPlaying) {
                // Si suena algo importante (música de misterio, etc), pausamos el fondo
                if (!bgm.paused) {
                    bgm.pause();
                }
            } else {
                // Si no hay audios especiales, el fondo sigue sonando
                if (bgm.paused && document.getElementById('overlay').style.display === 'none') {
                    bgm.play();
                }
            }
        }, 300); // Revisa cada 300ms
    })();
</script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<style>
    /* Estilo del Botón "Escanear QR" - Estilo AC Botón General */
    #ac-qr-trigger-btn {
        position: fixed; bottom: 15%; left: 50%; transform: translateX(-50%);
        background: #84c042; /* Verde AC */
        border: 4px solid #fff; color: white;
        padding: 15px 30px; border-radius: 50px;
        font-family: 'Seurat', sans-serif; font-size: 1.5rem; font-weight: bold;
        cursor: pointer; box-shadow: 0 6px 0 #618e31; /* Sombra verde oscuro */
        z-index: 2000; /* Asegura que esté por encima de todo */
        display: none; /* Oculto por defecto */
        transition: all 0.2s ease;
    }
    #ac-qr-trigger-btn:active { transform: translate(-50%, 4px); box-shadow: 0 2px 0 #618e31; }

    /* Contenedor del Escáner - Estilo Nookófono */
    #ac-qr-scanner-overlay {
        display: none; /* Oculto por defecto */
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #6D8B55; /* Fondo verde oscuro Nookófono */
        z-index: 3000; /* Por encima de todo */
        flex-direction: column; align-items: center; justify-content: center;
        gap: 20px;
        color: #fff;
        font-family: 'Seurat', sans-serif;
        padding: 20px;
    }

    #ac-qr-scanner-header {
        font-size: 1.8rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    }

    #ac-qr-scanner-video-wrapper {
        position: relative;
        width: 90%; max-width: 450px;
        aspect-ratio: 16/9; /* Proporción de pantalla de móvil */
        background: #000;
        border-radius: 15px;
        border: 8px solid #E8D595; /* Borde crema/oro Nookófono */
        overflow: hidden; /* Para que la guía no sobresalga */
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    #ac-qr-scanner-video {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Asegura que el video llene el contenedor */
        transform: scaleX(1); /* No invertir espejo */
    }

    #ac-qr-scanner-guide {
        position: absolute;
        top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: 60%; height: 60%; /* Marco de detección más centrado */
        border: 4px dashed #FFD700; /* Amarillo Nookófono para el marco */
        border-radius: 10px;
        pointer-events: none; /* No bloquear clics */
    }

    /* Botón Cerrar - Estilo Nookófono */
    #ac-qr-close-btn {
        background: #E06060; /* Rojo suave Nookófono */
        border: 3px solid #fff; color: white;
        padding: 12px 30px; border-radius: 30px;
        font-family: 'Seurat', sans-serif; font-size: 1.2rem;
        cursor: pointer; box-shadow: 0 4px 0 #A04040;
        transition: all 0.2s ease;
    }
    #ac-qr-close-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #A04040; }

    /* Animación del botón Nookófono */
    @keyframes ac-button-press {
        0% { transform: scale(1); }
        50% { transform: scale(0.95); }
        100% { transform: scale(1); }
    }
</style>

<button id="ac-qr-trigger-btn">Escanear el Siguiente QR</button>

<div id="ac-qr-scanner-overlay">
    <div id="ac-qr-scanner-header">¡Nookófono activado!</div>
    <div id="ac-qr-scanner-video-wrapper">
        <video id="ac-qr-scanner-video" playsinline></video>
        <div id="ac-qr-scanner-guide"></div>
    </div>
    <button id="ac-qr-close-btn">Cerrar Nookófono</button>
</div>

<script>
    (function() {
        const triggerBtn = document.getElementById('ac-qr-trigger-btn');
        const scannerOverlay = document.getElementById('ac-qr-scanner-overlay');
        const video = document.getElementById('ac-qr-scanner-video');
        const closeBtn = document.getElementById('ac-qr-close-btn');
        
        let scanning = false;
        let animationFrameId;

        // --- Función de detección de fin de juego (universal) ---
        function checkAndShowQRButton() {
            // Se busca el mensaje final de cumpleaños (si existe)
            const finalMsg = document.getElementById('final-msg');
            if (finalMsg && window.getComputedStyle(finalMsg).display !== 'none' && parseFloat(window.getComputedStyle(finalMsg).opacity) === 1) {
                // Una vez que el mensaje final es visible y totalmente opaco, esperamos un momento y mostramos el botón.
                // También ocultamos el personaje y el diálogo si aún están visibles.
                setTimeout(() => {
                    const characterImg = document.getElementById('character-img');
                    const dialogContainer = document.getElementById('dialog-container');
                    
                    if (characterImg) characterImg.style.opacity = '0'; // Desvanecer personaje
                    if (dialogContainer) dialogContainer.style.opacity = '0'; // Desvanecer diálogo

                    setTimeout(() => {
                        if (characterImg) characterImg.style.display = 'none';
                        if (dialogContainer) dialogContainer.style.display = 'none';
                        triggerBtn.style.display = 'block'; // Mostrar el botón de QR
                    }, 500); // Dar tiempo para el desvanecimiento
                }, 2000); // Esperar 2 segundos después del mensaje final para mostrar el botón
                return; // Ya hemos encontrado el final, no necesitamos seguir buscando
            }

            // Si no es el final, seguimos vigilando
            requestAnimationFrame(checkAndShowQRButton);
        }

        // --- Lógica del escáner QR ---
        triggerBtn.addEventListener('click', () => {
            scannerOverlay.style.display = 'flex';
            startScanner();
        });

        closeBtn.addEventListener('click', () => {
            stopScanner();
            scannerOverlay.style.display = 'none';
        });

        async function startScanner() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.play();
                scanning = true;
                tick(); // Empezar a escanear
            } catch (err) {
                alert("Para activar el Nookófono y escanear, necesitas permitir el acceso a la cámara. Asegúrate también de que la página se carga con HTTPS (candado seguro en la barra de dirección).");
                console.error("Error al iniciar el escáner QR:", err);
                scannerOverlay.style.display = 'none'; // Cerrar si hay error
            }
        }

        function stopScanner() {
            scanning = false;
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
        }

        function tick() {
            if (!scanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvasElement = document.createElement("canvas");
                canvasElement.width = video.videoWidth;
                canvasElement.height = video.videoHeight;
                const canvas = canvasElement.getContext("2d");
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) {
                    // Si el código es una URL (contiene "http"), redirigimos
                    if (code.data.includes('http')) {
                        stopScanner();
                        window.location.href = code.data;
                        return; // Detenemos la función para evitar más ticks
                    }
                }
            }
            animationFrameId = requestAnimationFrame(tick);
        }

        // Iniciar la vigilancia cuando la página se carga
        window.addEventListener('load', checkAndShowQRButton);
    })();
</script>
</body>
</html>
