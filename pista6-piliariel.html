<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gincana Animal Crossing - Pili y Ariel</title>
    <style>
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2');
            font-weight: bold;
        }

        * { box-sizing: border-box; }

        body { 
            background: #9bd7d5; 
            background-image: radial-gradient(rgba(255,255,255,0.3) 20%, transparent 20%);
            background-size: 30px 30px;
            font-family: 'Seurat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
        }

        /* CAPA DE HOJAS VERDES */
        #nook-weather { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .leaf { 
            position: absolute; width: 15px; height: 10px; 
            background: #a3d977; border-radius: 10px 2px; opacity: 0.8; 
            animation: leafFall linear infinite; 
        }
        @keyframes leafFall { 0% { transform: translate(-20px, 0) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translate(110vw, 50vh) rotate(720deg); opacity: 0; } }

        /* PERSONAJE - Contenedor con altura fija para evitar saltos */
        .char-container {
            height: 300px; /* Espacio reservado para el personaje */
            display: flex;
            align-items: flex-end;
            z-index: 30;
            margin-bottom: -35px;
        }

        #character-img {
            width: 65vw; max-width: 260px; height: auto;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none; transition: opacity 0.3s ease;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }

        #btn-abrir {
            background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a;
            font-family: 'Seurat', sans-serif;
        }

        /* CUADRO DE DIÁLOGO - Dimensiones estrictas */
        #dialog-container {
            width: 90%; max-width: 600px; height: 180px; 
            background: #fffdf0; border: 6px solid #f3e5ab; border-radius: 40px;
            padding: 30px 35px; position: relative; box-shadow: 0 8px 0 #d9c9a0; 
            cursor: pointer; display: none; z-index: 20;
            flex-shrink: 0; /* Evita que el cuadro cambie de tamaño */
        }

        #name-tag {
            position: absolute; top: -20px; left: 30px; 
            color: white; padding: 8px 20px; 
            border-radius: 20px; font-weight: bold; font-size: 1.1rem;
            border: 3px solid #fff; z-index: 40;
            min-width: 100px; text-align: center;
        }

        #text { color: #5d4a37; font-weight: bold; font-size: clamp(1.1rem, 4vw, 1.3rem); line-height: 1.3; }

        #btn-continuar {
            display: none; position: absolute; bottom: 20px; right: 30px;
            background: #4facfe; border: 3px solid #fff; color: white;
            padding: 8px 15px; border-radius: 25px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 0 #0076ad; z-index: 50;
        }

        #arrow { 
            position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-top: 15px solid #4facfe; animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }

        /* ESTILO TÍTULOS PISTA 1 */
        .nook-title {
            color: white; text-align: center; font-size: 2.2rem;
            -webkit-text-stroke: 8px #4b633a; paint-order: stroke fill;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2); margin-bottom: 20px;
        }

        /* CARGA Y MENÚ NOOK */
        #nook-loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #05070a; z-index: 5000; display: none;
        }
        .loading-gif { position: absolute; bottom: 30px; right: 30px; width: 80px; }

        #nook-master-menu {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; gap: 20px; align-items: center;
            z-index: 1000; width: 90%;
        }
        .ac-btn {
            border: 4px solid #fff; color: white; padding: 18px 30px; border-radius: 50px;
            font-size: 1.4rem; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px;
            text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }

        #nook-scanner-ui {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #7ca164; z-index: 2000; flex-direction: column; align-items: center; justify-content: center;
        }
        #nook-shell {
            width: 300px; background: #e8d595; padding: 30px; border-radius: 30px;
            box-shadow: 0 10px 0 #c4b07a;
        }
        #camera-box { width: 100%; aspect-ratio: 1/1; background: #000; border: 5px solid #5d4a37; border-radius: 15px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <div id="nook-weather"></div>

    <div class="char-container">
        <img id="character-img" src="https://dodo.ac/np/images/d/db/Able_Sisters_To_Go_with_Mabel.png" alt="Personaje">
    </div>

    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">¡Entra al taller de costura!</button>
    </div>

    <div id="dialog-container">
        <div id="name-tag">Pili</div> 
        <div id="text"></div>
        <button id="btn-continuar" onclick="mostrarMenuFinal(event)">Continuar</button>
        <div id="arrow" style="display:none"></div>
    </div>

    <div id="nook-loading-screen">
        <img class="loading-gif" src="https://media.tenor.com/PWXsfdUcE1wAAAAi/animal-crossing-waiting.gif">
    </div>

    <div id="nook-master-menu">
        <h2 class="nook-title">¿Qué quieres hacer ahora?</h2>
        <button class="ac-btn" style="background: #84c042; box-shadow: 0 6px 0 #618e31;" onclick="iniciarEscaner(event)">📱 USAR NOOKÓFONO</button>
        <button class="ac-btn" style="background: #ff7e7e; box-shadow: 0 6px 0 #c05050;" onclick="location.reload()">🔄 REPETIR PISTA</button>
    </div>

    <div id="nook-scanner-ui">
        <h2 class="nook-title">Nookófono</h2>
        <div id="nook-shell"><div id="camera-box"><video id="nook-video" playsinline></video></div></div>
        <button class="ac-btn" style="background:#ff7e7e; margin-top:20px;" onclick="cerrarEscaner()">CANCELAR</button>
    </div>

    <audio id="voice-pili" src="pili.wav" loop></audio>
    <audio id="voice-ariel" src="ariel.wav" loop></audio>
    <audio id="click-snd" src="./click.wav"></audio>
    <audio id="global-bgm" src="pista6.mp3" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        const imgPili = "https://dodo.ac/np/images/8/80/Mabel_NH.png";
        const imgAriel = "https://dodo.ac/np/images/9/90/Sasha_amiibo.png";

        const messages = [
            { char: "Pili", text: "¡Hola, Rocio pero qué guapa estás, prenda! ¡Y qué alegría que ya cumplas 30!" },
            { char: "Pili", text: "Estaba dándole las últimas puntadas a tu conjunto de gala; ¡me han dolido hasta las púas de tanto coser!" },
            { char: "Pili", text: "Pero ha valido la pena, vas a ser la envidia de toda la fiesta, prenda." },
            { char: "Ariel", text: "¡Je, je! ¡Hola! ¡Felicidades! Tu nuevo estilo mola mazo —dice Ariel mientras bosteza—." },
            { char: "Ariel", text: "Pili ha trabajado un montón, pero yo también he ayudado, ¿sabes, neutrino?" },
            { char: "Ariel", text: "He probado la suavidad de todas las telas... echándome una siestecita encima. Mola dormir. ¡Zuuut!" },
            { char: "Ariel", text: "¡Estás tan increíble que mola verte así! Hasta mis ojos se han despertado del todo, neutrino." },
            { char: "Pili", text: "Pili te mira con orgullo: 'Ahora que ya tienes el look de estrella, necesitas un momento de paz, prenda'." },
            { char: "Pili", text: "Gandulio y Encina han montado un rincón de relax en un sitio de la casa muy especial..." },
            { char: "Pili", text: "Busca el lugar donde el ritmo de la isla se pausa, ese rincón mullido donde te sientas a charlar sin mirar el reloj." },
            { char: "Pili", text: "Allí, donde los pies descansan pero la mente vuela." },
            { char: "Ariel", text: "¡Ve a verlos, neutrino!" }
        ];

        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;

        function playClick() { const s = document.getElementById("click-snd"); s.currentTime = 0; s.play().catch(()=>{}); }

        function empezarJuego(event) {
            event.stopPropagation();
            playClick();
            document.getElementById("global-bgm").play();
            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            updateCharacter();
            startMessage();
        }

        function updateCharacter() {
            const currentObj = messages[currentMsgIndex];
            const nameTag = document.getElementById("name-tag");
            const charImg = document.getElementById("character-img");
            const arrow = document.getElementById("arrow");
            
            // Cambiar imagen sin mover el contenedor
            if (charImg.src !== (currentObj.char === "Pili" ? imgPili : imgAriel)) {
                charImg.style.opacity = "0";
                setTimeout(() => {
                    charImg.src = currentObj.char === "Pili" ? imgPili : imgAriel;
                    charImg.style.opacity = "1";
                }, 100);
            }

            nameTag.innerHTML = currentObj.char;
            if (currentObj.char === "Pili") {
                nameTag.style.background = "#4facfe"; 
                arrow.style.borderTopColor = "#4facfe";
            } else {
                nameTag.style.background = "#ff9a9e"; 
                arrow.style.borderTopColor = "#ff9a9e";
            }
        }

        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].text.length;
                document.getElementById("text").innerHTML = messages[currentMsgIndex].text;
                stopVoice();
            } else if (currentMsgIndex < messages.length - 1) {
                playClick();
                currentMsgIndex++;
                updateCharacter();
                startMessage();
            }
        }

        function startMessage() {
            isTyping = true; charIndex = 0;
            document.getElementById("text").innerHTML = "";
            document.getElementById("btn-continuar").style.display = "none";
            document.getElementById("arrow").style.display = "none";
            
            const currentObj = messages[currentMsgIndex];
            if (currentObj.char === "Pili") {
                document.getElementById("voice-pili").play();
            } else {
                document.getElementById("voice-ariel").play();
            }
            typeWriter();
        }

        function typeWriter() {
            const currentText = messages[currentMsgIndex].text;
            if (charIndex < currentText.length) {
                document.getElementById("text").innerHTML += currentText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 35);
            } else { stopVoice(); }
        }

        function stopVoice() {
            isTyping = false;
            document.getElementById("voice-pili").pause(); document.getElementById("voice-pili").currentTime = 0;
            document.getElementById("voice-ariel").pause(); document.getElementById("voice-ariel").currentTime = 0;
            if (currentMsgIndex < messages.length - 1) {
                document.getElementById("arrow").style.display = "block";
            } else {
                document.getElementById("btn-continuar").style.display = "block";
            }
        }

        function mostrarMenuFinal(event) {
            event.stopPropagation();
            playClick();
            document.querySelector('.char-container').style.opacity = '0';
            document.getElementById('dialog-container').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('dialog-container').style.display = 'none';
                document.getElementById('nook-master-menu').style.display = 'flex';
                gameActive = false;
            }, 600);
        }

        async function iniciarEscaner(event) {
            event.stopPropagation();
            playClick();
            document.getElementById('nook-loading-screen').style.display = 'block';
            setTimeout(async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    document.getElementById('nook-video').srcObject = stream;
                    document.getElementById('nook-video').play();
                    document.getElementById('nook-loading-screen').style.display = 'none'; 
                    document.getElementById('nook-scanner-ui').style.display = 'flex';
                    window.scannerStream = stream;
                    requestAnimationFrame(scanTick);
                } catch (err) { alert("Error cámara"); }
            }, 3000);
        }

        function cerrarEscaner() {
            playClick();
            if(window.scannerStream) window.scannerStream.getTracks().forEach(t => t.stop());
            document.getElementById('nook-scanner-ui').style.display = 'none';
        }

        function scanTick() {
            const video = document.getElementById('nook-video');
            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code && code.data.startsWith('http')) {
                    window.location.href = code.data;
                    return;
                }
            }
            if(document.getElementById('nook-scanner-ui').style.display === 'flex') requestAnimationFrame(scanTick);
        }

        const w = document.getElementById('nook-weather');
        for(let i=0; i<6; i++) {
            const l = document.createElement('div');
            l.className = 'leaf';
            l.style.top = Math.random()*80+'%';
            l.style.animationDuration = (Math.random()*4+4)+'s';
            l.style.animationDelay = (Math.random()*5)+'s';
            w.appendChild(l);
        }
    </script>
</body>
</html>
