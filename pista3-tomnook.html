<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gincana Animal Crossing - Tom Nook</title>
    <style>
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2');
            font-weight: bold;
        }

        * { box-sizing: border-box; }

        body { 
            background: #7db9e8; 
            background-image: radial-gradient(rgba(0,0,0,0.1) 20%, transparent 20%);
            background-size: 30px 30px;
            font-family: 'Seurat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
        }

        /* CAPA DE CLIMA (HOJAS VERDES PISTA 1) */
        #nook-weather { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .leaf { 
            position: absolute; width: 15px; height: 10px; 
            background: #a3d977; /* Color verde exacto de Pista 1 */
            border-radius: 10px 2px; opacity: 0.8; animation: leafFall linear infinite; 
        }
        @keyframes leafFall { 0% { transform: translate(-20px, 0) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translate(110vw, 50vh) rotate(720deg); opacity: 0; } }

        /* PERSONAJE */
        #character-img {
            width: 65vw; max-width: 280px; height: auto; z-index: 30;
            margin-bottom: -30px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none; transition: opacity 0.6s;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }

        #btn-abrir {
            background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a;
            font-family: 'Seurat', sans-serif;
        }

        /* CUADRO DE DIÁLOGO */
        #dialog-container {
            width: 90%; max-width: 600px; height: 180px; 
            background: #fffdf0; border: 6px solid #f3e5ab; border-radius: 40px;
            padding: 30px 35px; position: relative; box-shadow: 0 8px 0 #d9c9a0; 
            cursor: pointer; display: none; z-index: 20; transition: opacity 0.6s;
        }

        #name-tag {
            position: absolute; top: -20px; left: 30px; 
            background: #79a6d2; color: white; padding: 8px 20px; 
            border-radius: 20px; font-weight: bold; border: 3px solid #fff;
        }

        #text { color: #5d4a37; font-weight: bold; font-size: clamp(1rem, 3.8vw, 1.2rem); line-height: 1.3; }

        #btn-proximo {
            display: none; position: absolute; bottom: 20px; right: 30px;
            background: #79a6d2; border: 3px solid #fff; color: white;
            padding: 8px 15px; border-radius: 25px; font-size: 0.9rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #5a85b0;
            z-index: 50;
        }

        #arrow { 
            position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-top: 15px solid #79a6d2; animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }

        /* PANTALLA DE CARGA NOOK (AZUL CASI NEGRO) */
        #nook-loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #05070a; z-index: 5000; display: none;
        }
        .loading-gif {
            position: absolute; bottom: 30px; right: 30px;
            width: 80px; height: auto;
        }

        /* MENÚ NOOKÓFONO FINAL */
        #nook-master-menu {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; gap: 20px; align-items: center;
            z-index: 1000; width: 90%;
        }
        .ac-btn {
            border: 4px solid #fff; color: white; padding: 18px 30px; border-radius: 50px;
            font-family: 'Seurat', sans-serif; font-size: 1.4rem; font-weight: bold;
            cursor: pointer; width: 100%; max-width: 300px; text-align: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        #btn-nook-open { background: #84c042; box-shadow: 0 6px 0 #618e31; }
        #btn-game-reset { background: #ff7e7e; box-shadow: 0 6px 0 #c05050; }

        /* ESCÁNER UI */
        #nook-scanner-ui {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #7ca164; z-index: 2000; flex-direction: column; 
            align-items: center; justify-content: center;
        }
        #nook-shell {
            width: 320px; background: #e8d595; padding: 40px; position: relative;
            box-shadow: 0 10px 0 #c4b07a; animation: liquid 5s infinite;
        }
        #camera-box { width: 100%; aspect-ratio: 1/1; background: #000; border: 6px solid #5d4a37; border-radius: 20px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        @keyframes liquid {
            0%, 100% { border-radius: 15% 35% 20% 40% / 25% 20% 35% 15%; }
            50% { border-radius: 35% 15% 40% 20% / 20% 30% 15% 35%; }
        }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <div id="nook-weather"></div>

    <img id="character-img" src="https://dodo.ac/np/images/e/e3/Tom_Nook_NH.png" alt="Tom Nook">

    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">¡Hablar con Tom Nook!</button>
    </div>

    <div id="dialog-container">
        <div id="name-tag">Tom Nook</div> 
        <div id="text"></div>
        <button id="btn-proximo" onclick="terminarDialogo(event)">Continuar</button>
        <div id="arrow" style="display:none"></div>
    </div>

    <div id="nook-loading-screen">
        <img class="loading-gif" src="https://media.tenor.com/PWXsfdUcE1wAAAAi/animal-crossing-waiting.gif" alt="Cargando...">
    </div>

    <div id="nook-master-menu">
        <h2 style="color:white; -webkit-text-stroke: 6px #5d4a37; paint-order: stroke fill; font-size: 2rem; text-align: center;">¿Qué quieres hacer ahora?</h2>
        <button id="btn-nook-open" class="ac-btn" onclick="iniciarEscaner(event)">📱 USAR NOOKÓFONO</button>
        <button id="btn-game-reset" class="ac-btn" onclick="location.reload()">🔄 REPETIR PISTA</button>
    </div>

    <div id="nook-scanner-ui">
        <h2 style="color:white; -webkit-text-stroke: 6px #5d4a37; paint-order: stroke fill; font-size: 2.5rem;">Nookófono</h2>
        <div id="nook-shell"><div id="camera-box"><video id="nook-video" playsinline></video></div></div>
        <button class="ac-btn" style="background:#ff7e7e; margin-top:30px;" onclick="cerrarEscaner()">CANCELAR</button>
    </div>

    <audio id="voice-sound" src="tomnook.wav" loop></audio>
    <audio id="global-bgm" src="pista3.mp3" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        const messages = [
            "¡Sí, sí! ¡Bienvenida, estimada Rocío! ¡Qué alegría verte por aquí!",
            "Como gestor y dueño de esta próspera isla, no podía faltar en un día tan señalado como tu 30 cumpleaños.",
            "Estaba justo aquí, con Minina, que está inspeccionando el terreno con mucha elegancia, supervisando los planos de este gran evento.",
            "Me ha llegado un rumor a la oficina de gestión... Dicen que estás en trámites para una nueva parcela fuera de la isla.",
            "Y que los banqueros de allí son un poco... ¿cómo decirlo?... ¡torpes! ¡Vaya desastre, sí, sí!",
            "Escucha, Rocío, si esos aficionados te dan más problemas, recuerda que en Nook Inc. siempre tenemos un contrato de hipoteca a medida esperándote.",
            "Sin intereses, sin prisas y sin bancos que se olviden de los papeles. ¡Aquí los trámites se cierran con un apretón de manos!",
            "Pero bueno, no hablemos de negocios, que hoy el plan de desarrollo es tu felicidad.",
            "Para conseguir el avituallamiento oficial de la fiesta, debes dirigirte al Almacén.",
            "Tere te espera con los botes de confeti y los preparativos listos bajo una escalera de madera.",
            "¡No olvides caminar con paso firme, sí, sí!"
        ];

        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;
        const clickSnd = new Audio('./click.wav');

        function playClick() { clickSnd.currentTime = 0; clickSnd.play().catch(()=>{}); }

        function empezarJuego(event) {
            event.stopPropagation();
            playClick();
            document.getElementById("global-bgm").play();
            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            startMessage();
        }

        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].length;
                document.getElementById("text").innerHTML = messages[currentMsgIndex];
                stopVoice();
            } else if (currentMsgIndex < messages.length - 1) {
                playClick();
                currentMsgIndex++;
                startMessage();
            }
        }

        function startMessage() {
            isTyping = true; charIndex = 0;
            document.getElementById("text").innerHTML = "";
            document.getElementById("btn-proximo").style.display = "none";
            document.getElementById("arrow").style.display = "none";
            document.getElementById("voice-sound").play();
            typeWriter();
        }

        function typeWriter() {
            if (charIndex < messages[currentMsgIndex].length) {
                document.getElementById("text").innerHTML += messages[currentMsgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 40);
            } else { stopVoice(); }
        }

        function stopVoice() {
            isTyping = false;
            document.getElementById("voice-sound").pause();
            document.getElementById("voice-sound").currentTime = 0;
            if (currentMsgIndex < messages.length - 1) {
                document.getElementById("arrow").style.display = "block";
            } else {
                document.getElementById("btn-proximo").style.display = "block";
            }
        }

        function terminarDialogo(event) {
            event.stopPropagation();
            playClick();
            document.getElementById('character-img').style.opacity = '0';
            document.getElementById('dialog-container').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('character-img').style.display = 'none';
                document.getElementById('dialog-container').style.display = 'none';
                document.getElementById('nook-master-menu').style.display = 'flex';
                gameActive = false;
            }, 600);
        }

        let stream = null;
        async function iniciarEscaner(event) {
            event.stopPropagation();
            playClick();
            const loading = document.getElementById('nook-loading-screen');
            loading.style.display = 'block';
            
            setTimeout(async () => {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    const video = document.getElementById('nook-video');
                    video.srcObject = stream;
                    video.play();
                    loading.style.display = 'none'; 
                    document.getElementById('nook-scanner-ui').style.display = 'flex';
                    requestAnimationFrame(scanTick);
                } catch (err) { 
                    loading.style.display = 'none';
                    alert("Por favor, permite el acceso a la cámara."); 
                }
            }, 3000);
        }

        function cerrarEscaner() {
            playClick();
            if(stream) stream.getTracks().forEach(t => t.stop());
            document.getElementById('nook-scanner-ui').style.display = 'none';
        }

        function scanTick() {
            const video = document.getElementById('nook-video');
            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code && code.data.startsWith('http')) {
                    window.location.href = code.data;
                    return;
                }
            }
            if(document.getElementById('nook-scanner-ui').style.display === 'flex') requestAnimationFrame(scanTick);
        }

        // Hojas verdes de la Pista 1
        const weather = document.getElementById('nook-weather');
        for(let i=0; i<6; i++) {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.style.top = Math.random()*80 + '%';
            leaf.style.animationDuration = (Math.random()*5 + 5) + 's';
            leaf.style.animationDelay = (Math.random()*5) + 's';
            weather.appendChild(leaf);
        }
    </script>
</body>
</html>
