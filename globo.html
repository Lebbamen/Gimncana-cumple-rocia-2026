<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>¡Sorpresa de Mónica! - Maravilla</title>
    <style>
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2');
            font-weight: bold;
        }

        * { box-sizing: border-box; }

        body { 
            background: #87CEEB; 
            background: linear-gradient(to bottom, #87CEEB 0%, #B0E2FF 100%);
            font-family: 'Seurat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
            position: relative;
        }

        /* GLOBO FLOTANTE DE FONDO (INICIAL) */
        #balloon-bg {
            position: fixed;
            width: 80px;
            z-index: 2;
            pointer-events: none;
            animation: moveAround 15s linear infinite, hover 3s ease-in-out infinite;
        }

        @keyframes moveAround {
            0% { left: -100px; top: 20%; }
            25% { left: 30vw; top: 10%; }
            50% { left: 60vw; top: 25%; }
            75% { left: 90vw; top: 15%; }
            100% { left: 110vw; top: 20%; }
        }

        @keyframes hover {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        /* NUBES */
        .cloud-container { position: fixed; top: 0; left: 0; width: 100%; height: 60%; pointer-events: none; z-index: 1; }
        .cloud { position: absolute; background: white; width: 120px; height: 40px; border-radius: 50px; opacity: 0.8; animation: moveClouds linear infinite; }
        .cloud::after, .cloud::before { content: ''; position: absolute; background: white; border-radius: 50%; }
        .cloud::after { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud::before { width: 40px; height: 40px; top: -15px; left: 55px; }
        @keyframes moveClouds { from { transform: translateX(-150px); } to { transform: translateX(110vw); } }

        /* CAPA DE HOJAS */
        #nook-weather { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .leaf { position: absolute; width: 15px; height: 10px; background: #a3d977; border-radius: 10px 2px; opacity: 0.8; animation: leafFall linear infinite; }
        @keyframes leafFall { 0% { transform: translate(-20px, 0) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translate(110vw, 50vh) rotate(720deg); opacity: 0; } }

        /* PERSONAJE (Oculto inicialmente) */
        .char-container { height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; z-index: 30; margin-bottom: -20px; }
        #character-img { 
            width: 75vw; max-width: 310px; height: auto; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1)); 
            z-index: 31; 
            display: none; /* OCULTO POR DEFECTO */
        }

        /* DIÁLOGO */
        #dialog-container { width: 90%; max-width: 600px; height: 195px; background: #fffdf0; border: 6px solid #f3e5ab; border-radius: 40px; padding: 25px 30px; position: relative; box-shadow: 0 8px 0 #d9c9a0; cursor: pointer; display: none; z-index: 20; }
        #name-tag { position: absolute; top: -20px; left: 30px; color: white; padding: 8px 25px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; border: 3px solid #fff; z-index: 100; background: #ff8e4a; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        #text { color: #5d4a37; font-weight: bold; font-size: 1.1rem; line-height: 1.3; }
        #arrow { position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 15px solid #ff8e4a; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }

        /* INTERFAZ */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
        #btn-abrir { background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37; padding: 15px 30px; border-radius: 50px; font-size: 1.4rem; font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a; font-family: 'Seurat'; }

        /* NOOK MENU STUFF */
        .nook-title { color: white; text-align: center; font-size: 2.2rem; -webkit-text-stroke: 8px #4b633a; paint-order: stroke fill; margin-bottom: 20px; }
        #nook-loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #05070a; z-index: 5000; display: none; }
        .loading-gif { position: absolute; bottom: 30px; right: 30px; width: 80px; }
        #nook-master-menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; flex-direction: column; gap: 20px; align-items: center; z-index: 1000; width: 90%; }
        .ac-btn { border: 4px solid #fff; color: white; padding: 18px 30px; border-radius: 50px; font-size: 1.4rem; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2); font-family: 'Seurat'; }
        #nook-scanner-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #7ca164; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        #nook-shell { width: 300px; background: #e8d595; padding: 30px; border-radius: 30px; box-shadow: 0 10px 0 #c4b07a; }
        #camera-box { width: 100%; aspect-ratio: 1/1; background: #000; border: 5px solid #5d4a37; border-radius: 15px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <img id="balloon-bg" src="https://dodo.ac/np/images/5/5d/Balloon_NL_Artwork.png" alt="Regalo Flotante">

    <div class="cloud-container" id="clouds"></div>
    <div id="nook-weather"></div>

    <div class="char-container">
        <img id="character-img" src="https://dodo.ac/np/images/1/1b/Audie_NH.png" alt="Mónica">
    </div>

    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">¡Mira ese regalo tan total! 🎈</button>
    </div>

    <div id="dialog-container">
        <div id="name-tag">Mónica</div> 
        <div id="text"></div>
        <div id="arrow" style="display:none"></div>
    </div>

    <div id="nook-loading-screen"><img class="loading-gif" src="https://media.tenor.com/PWXsfdUcE1wAAAAi/animal-crossing-waiting.gif"></div>
    <div id="nook-master-menu">
        <h2 class="nook-title">¿Qué quieres hacer ahora?</h2>
        <button class="ac-btn" style="background: #84c042; box-shadow: 0 6px 0 #618e31;" onclick="iniciarEscaner()">📱 USAR NOOKÓFONO</button>
        <button class="ac-btn" style="background: #ff7e7e; box-shadow: 0 6px 0 #c05050;" onclick="location.reload()">🔄 REPETIR ESCENA</button>
    </div>
    <div id="nook-scanner-ui">
        <h2 class="nook-title">Nookófono</h2>
        <div id="nook-shell"><div id="camera-box"><video id="nook-video" playsinline></video></div></div>
        <button class="ac-btn" style="background:#ff7e7e; margin-top:20px;" onclick="cerrarEscaner()">CANCELAR</button>
    </div>

    <audio id="voice-monica" src="animalese.wav" loop></audio>
    <audio id="click-snd" src="./click.wav"></audio>
    <audio id="globo-snd" src="globo.wav"></audio>
    <audio id="global-bgm" src="globito.mp3" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        const messages = [
            { text: "¡OH-MI-GOSH! ¡Rocío, mi amigui! ¡Pero si estás de maravilla! ¡Ese look es de portada de Miss Nintendique, guau! ✨" },
            { text: "¡Bienvenida a mi súper puesto de dulces y café! 🍭☕ Lo he decorado con todo mi estilo pop. ¡Es una maravilla total! 🌈" },
            { text: "He estado practicando mi autógrafo para mis amiguis toda la mañana porque, ya sabes, ¡en cualquier momento seré famosa! 🎬🌟" },
            { text: "¡Oye, oye! ¿Has visto eso? ¡Un regalo flotante de acaba de aparecer sobre mi puesto! ¡Es una señal, maravilla! 🎈" },
            { text: "He leído en Miss Nintendique que los accesorios sorpresa son lo más de lo más. ¡Este regalo es para ti, guau! 🎀" },
            { text: "¡Seguro que dentro hay algo que te va a venir ideal para cuando llegues a la gran fiesta final! ¡Qué emoción! 🎁💥" },
            { text: "Espera... ¿de qué estábamos hablando? ¡Ah, sí! ¡El regalo! ¡No te distraigas como yo y ábrelo ya, guau! 🦊" },
            { text: "¡Va a ser un momento divino de la muerte! ¡Corre, amigui, que la fiesta te espera y yo tengo que ponerme super mona! 💖" }
        ];

        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;

        function playClick() { const s = document.getElementById("click-snd"); s.currentTime = 0; s.play().catch(()=>{}); }

        function empezarJuego(event) {
            event.stopPropagation();
            
            // Ocultar globo y mostrar a Mónica
            document.getElementById("balloon-bg").style.display = "none";
            document.getElementById("character-img").style.display = "block"; // AHORA APARECE MÓNICA
            
            // Sonidos
            document.getElementById("globo-snd").play();
            setTimeout(() => { document.getElementById("global-bgm").play(); }, 2000);

            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            startMessage();
        }

        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].text.length;
                document.getElementById("text").innerHTML = messages[currentMsgIndex].text;
                stopVoice();
            } else if (currentMsgIndex < messages.length - 1) {
                playClick();
                currentMsgIndex++;
                startMessage();
            } else {
                mostrarMenuFinal();
            }
        }

        function startMessage() {
            isTyping = true; charIndex = 0;
            document.getElementById("text").innerHTML = "";
            document.getElementById("arrow").style.display = "none";
            document.getElementById("voice-monica").play();
            typeWriter();
        }

        function typeWriter() {
            const currentText = messages[currentMsgIndex].text;
            if (charIndex < currentText.length) {
                document.getElementById("text").innerHTML += currentText.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 35);
            } else { stopVoice(); }
        }

        function stopVoice() {
            isTyping = false;
            document.getElementById("voice-monica").pause();
            document.getElementById("voice-monica").currentTime = 0;
            document.getElementById("arrow").style.display = "block";
        }

        function mostrarMenuFinal() {
            playClick();
            document.getElementById('dialog-container').style.display = 'none';
            document.getElementById('nook-master-menu').style.display = 'flex';
            document.querySelector('.char-container').style.opacity = '0';
            gameActive = false;
        }

        // --- SCRIPTS DE FONDO ---
        const cloudContainer = document.getElementById('clouds');
        for(let i=0; i<5; i++) {
            const c = document.createElement('div');
            c.className = 'cloud';
            c.style.top = (Math.random()*40+5) + '%';
            c.style.animationDuration = (Math.random()*20+20) + 's';
            c.style.animationDelay = (Math.random()*20) + 's';
            cloudContainer.appendChild(c);
        }

        const w = document.getElementById('nook-weather');
        for(let i=0; i<6; i++) {
            const l = document.createElement('div');
            l.className = 'leaf';
            l.style.top = Math.random()*80+'%';
            l.style.animationDuration = (Math.random()*4+4)+'s';
            l.style.animationDelay = (Math.random()*5)+'s';
            w.appendChild(l);
        }

        // --- NOOKÓFONO LOGIC ---
        async function iniciarEscaner() {
            playClick();
            document.getElementById('nook-loading-screen').style.display = 'block';
            setTimeout(async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    document.getElementById('nook-video').srcObject = stream;
                    document.getElementById('nook-video').play();
                    document.getElementById('nook-loading-screen').style.display = 'none'; 
                    document.getElementById('nook-scanner-ui').style.display = 'flex';
                    window.scannerStream = stream;
                    requestAnimationFrame(scanTick);
                } catch (err) { alert("Error cámara"); }
            }, 3000);
        }

        function cerrarEscaner() {
            playClick();
            if(window.scannerStream) window.scannerStream.getTracks().forEach(t => t.stop());
            document.getElementById('nook-scanner-ui').style.display = 'none';
        }

        function scanTick() {
            const v = document.getElementById('nook-video');
            if (v && v.readyState === v.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement("canvas");
                canvas.width = v.videoWidth; canvas.height = v.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code && code.data.startsWith('http')) { window.location.href = code.data; return; }
            }
            if(document.getElementById('nook-scanner-ui').style.display === 'flex') requestAnimationFrame(scanTick);
        }
    </script>
</body>
</html>
