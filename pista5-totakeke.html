<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gincana Animal Crossing - Totakeke</title>
    <style>
        /* Importación Robusta de Seurat */
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; }

        body { 
            background: #e2e2e2; 
            background-image: radial-gradient(rgba(0,0,0,0.05) 20%, transparent 20%);
            background-size: 30px 30px;
            font-family: 'Seurat', 'Arial Rounded MT Bold', sans-serif !important; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
            transition: background 0.5s ease;
        }

        /* EFECTO FOCO / APAGÓN */
        #spotlight-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 25;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            mask-image: radial-gradient(circle 150px at 50% 60%, transparent 100%, black 100%);
            -webkit-mask-image: radial-gradient(circle 150px at 50% 60%, transparent 0%, black 100%);
        }

        body.lights-out #spotlight-overlay {
            opacity: 1;
        }

        #character-img {
            width: 65vw; 
            max-width: 280px;
            height: auto;
            z-index: 30;
            margin-bottom: -40px; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none;
            transition: filter 0.5s ease;
        }

        body.lights-out #character-img {
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.4)) brightness(1.2);
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }

        #btn-abrir {
            background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a;
            font-family: 'Seurat', sans-serif !important;
        }

        #dialog-container {
            width: 90%; 
            max-width: 600px; 
            height: 180px; 
            background: #fffdf0; 
            border: 6px solid #f3e5ab; 
            border-radius: 40px;
            padding: 30px 35px; 
            position: relative; 
            box-shadow: 0 8px 0 #d9c9a0; 
            cursor: pointer; 
            display: none;
            z-index: 40;
        }

        #name-tag {
            position: absolute; 
            top: -20px; left: 30px; 
            background: #666666; 
            color: white; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 1.1rem;
            border: 3px solid #fff;
            z-index: 45;
            font-family: 'Seurat', sans-serif !important;
        }

        #text { 
            color: #5d4a37; 
            font-family: 'Seurat', sans-serif !important;
            font-size: clamp(1rem, 3.8vw, 1.2rem); 
            line-height: 1.3; 
            overflow: hidden;
            height: 100%;
            font-weight: bold;
        }

        #btn-reiniciar {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: #666666;
            border: 3px solid #fff; 
            color: white;
            padding: 8px 15px; 
            border-radius: 25px; 
            font-size: 0.9rem;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #333333;
            z-index: 50;
            font-family: 'Seurat', sans-serif !important;
        }

        #arrow { 
            position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-top: 15px solid #666666; animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <div id="spotlight-overlay"></div>

    <img id="character-img" src="https://dodo.ac/np/images/8/81/K.K._Slider_NH.png" alt="Totakeke">

    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">¡Hablar con Totakeke!</button>
    </div>

    <div id="dialog-container">
        <div id="name-tag">Totakeke</div> 
        <div id="text"></div>
        <button id="btn-reiniciar" onclick="reiniciarGincana(event)">Reiniciar</button>
        <div id="arrow" style="display:none"></div>
    </div>

    <audio id="voice-sound" src="totakeke.wav" loop></audio>
    <audio id="guitar-sound" src="guitarra.mp3" loop></audio>

    <script>
        const messages = [
            "Hey, colega... felicidades.",
            "Los 30 años son como ese vinilo que compras por la portada y acaba siendo tu disco favorito.",
            "Tienen cuerpo, tienen alma y suenan mucho mejor que los 20.",
            "He estado ajustando las cuerdas de mi guitarra para dedicarte una canción que compuse mirando las estrellas de esta isla.",
            "Canela y Mónica están terminando de colocar los altovacoces en la plaza, pero me han dado un aviso importante.",
            "Una estrella del McDonald's como tú no puede subir al escenario con ropa de diario.",
            "Pili ha montado un taller de costura de urgencia en un lugar muy especial...",
            "Busca el lugar donde guardas todas tus versiones,",
            "ese refugio de madera donde el tejido espera su momento para salir a pasear.",
            "Allí, tras las puertas que guardan tu mejor imagen,",
            "te espera el diseño que te hará brillar.",
            "Ve a verla, tiene algo que te va a dejar sin palabras. ¡Nos vemos en el concierto, colega!"
        ];

        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;

        const textDiv = document.getElementById("text");
        const restartBtn = document.getElementById("btn-reiniciar");
        const arrow = document.getElementById("arrow");
        const guitarAudio = document.getElementById("guitar-sound");
        const voiceAudio = document.getElementById("voice-sound");

        function empezarJuego(event) {
            event.stopPropagation(); 
            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            startMessage();
        }

        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].length;
                textDiv.innerHTML = messages[currentMsgIndex];
                stopVoiceOnly(); // Detiene solo el animalese al saltar el texto
            } else {
                if (currentMsgIndex < messages.length - 1) {
                    currentMsgIndex++;
                    startMessage();
                }
            }
        }

        function startMessage() {
            isTyping = true;
            charIndex = 0;
            textDiv.innerHTML = "";
            restartBtn.style.display = "none";
            arrow.style.display = "none";

            // Lógica de Luces y Guitarra (Mensajes del 7 al 10)
            if (currentMsgIndex >= 7 && currentMsgIndex <= 10) {
                document.body.classList.add('lights-out');
                if (guitarAudio.paused) guitarAudio.play();
            } else {
                document.body.classList.remove('lights-out');
                // Si ya no estamos en la sección, la guitarra se detiene
                guitarAudio.pause();
                guitarAudio.currentTime = 0;
            }

            voiceAudio.play();
            typeWriter();
        }

        function typeWriter() {
            if (charIndex < messages[currentMsgIndex].length) {
                textDiv.innerHTML += messages[currentMsgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 40);
            } else {
                stopVoiceOnly();
            }
        }

        function stopVoiceOnly() {
            isTyping = false;
            voiceAudio.pause();
            voiceAudio.currentTime = 0;
            
            if (currentMsgIndex < messages.length - 1) {
                arrow.style.display = "block";
            } else {
                restartBtn.style.display = "block";
            }
        }

        function reiniciarGincana(event) {
            event.stopPropagation(); 
            currentMsgIndex = 0;
            document.body.classList.remove('lights-out');
            guitarAudio.pause();
            guitarAudio.currentTime = 0;
            restartBtn.style.display = "none";
            startMessage();
        }
    </script>
<audio id="global-bgm" src="pista5.mp3" loop></audio>

<script>
    (function() {
        const bgm = document.getElementById('global-bgm');
        bgm.volume = 0.3; // Volumen de la música de fondo (0.0 a 1.0)

        // Función para iniciar la música con el primer clic del usuario (exigencia de navegadores)
        document.addEventListener('click', () => {
            if (bgm.paused) bgm.play();
        }, { once: true });

        // Monitor de audios
        setInterval(() => {
            const allAudios = document.querySelectorAll('audio:not(#global-bgm)');
            let specialAudioPlaying = false;

            allAudios.forEach(audio => {
                // Si el audio está sonando y NO es el balbuceo (animalese/voice)
                // Ajusta los nombres de archivo según tus .wav
                const isAnimalese = audio.src.includes('animalese') || 
                                    audio.id.includes('voice') || 
                                    audio.src.includes('gandulio.wav') || 
                                    audio.src.includes('totakeke.wav');

                if (!audio.paused && !isAnimalese) {
                    specialAudioPlaying = true;
                }
            });

            if (specialAudioPlaying) {
                // Si suena algo importante (música de misterio, etc), pausamos el fondo
                if (!bgm.paused) {
                    bgm.pause();
                }
            } else {
                // Si no hay audios especiales, el fondo sigue sonando
                if (bgm.paused && document.getElementById('overlay').style.display === 'none') {
                    bgm.play();
                }
            }
        }, 300); // Revisa cada 300ms
    })();
</script>
</body>
</html>
