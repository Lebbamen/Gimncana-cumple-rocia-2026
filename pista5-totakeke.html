<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gincana Animal Crossing - Totakeke</title>
    <style>
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2');
            font-weight: bold;
        }

        * { box-sizing: border-box; }

        body { 
            background: #e2e2e2; 
            background-image: radial-gradient(rgba(0,0,0,0.05) 20%, transparent 20%);
            background-size: 30px 30px;
            font-family: 'Seurat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
            transition: background 1.5s ease;
        }

        /* CAPA DE HOJAS VERDES */
        #nook-weather { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .leaf { 
            position: absolute; width: 15px; height: 10px; 
            background: #a3d977; border-radius: 10px 2px; opacity: 0.8; 
            animation: leafFall linear infinite; 
        }
        @keyframes leafFall { 0% { transform: translate(-20px, 0) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translate(110vw, 50vh) rotate(720deg); opacity: 0; } }

        /* PERSONAJE */
        #character-img {
            width: 65vw; max-width: 280px; height: auto; z-index: 30;
            margin-bottom: -30px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none; 
            transition: transform 1.2s ease, filter 1.2s ease;
        }

        /* EFECTO CONCIERTO: SPOTLIGHT + SUBIDA SUTIL 20PX */
        body.spotlight { background: #1a1a1a !important; }
        body.spotlight #character-img { 
            filter: drop-shadow(0 0 50px rgba(255,255,255,0.6)) brightness(1.2);
            transform: translateY(-20px) scale(1.05); 
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }

        #btn-abrir {
            background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a;
            font-family: 'Seurat', sans-serif;
        }

        #dialog-container {
            width: 90%; max-width: 600px; height: 180px; 
            background: #fffdf0; border: 6px solid #f3e5ab; border-radius: 40px;
            padding: 30px 35px; position: relative; box-shadow: 0 8px 0 #d9c9a0; 
            cursor: pointer; display: none; z-index: 20;
        }

        #name-tag {
            position: absolute; top: -20px; left: 30px; 
            background: #7f8c8d; color: white; padding: 8px 20px; 
            border-radius: 20px; font-weight: bold; border: 3px solid #fff;
        }

        #text { color: #5d4a37; font-weight: bold; font-size: clamp(0.95rem, 3.8vw, 1.15rem); line-height: 1.3; }

        #btn-proximo {
            display: none; position: absolute; bottom: 20px; right: 30px;
            background: #7f8c8d; border: 3px solid #fff; color: white;
            padding: 8px 15px; border-radius: 25px; font-weight: bold; cursor: pointer;
        }

        #arrow { 
            position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-top: 15px solid #7f8c8d; animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }

        /* TITULOS ESTILO PISTA 1 (Blanco con borde verde oscuro) */
        .nook-title {
            color: white;
            text-align: center;
            font-size: 2.2rem;
            -webkit-text-stroke: 8px #4b633a; /* Borde grueso verde oscuro */
            paint-order: stroke fill;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        /* PANTALLA DE CARGA NOOK */
        #nook-loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #05070a; z-index: 5000; display: none;
        }
        .loading-gif { position: absolute; bottom: 30px; right: 30px; width: 80px; }

        #nook-master-menu {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: none; flex-direction: column; gap: 20px; align-items: center;
            z-index: 1000; width: 90%;
        }
        .ac-btn {
            border: 4px solid #fff; color: white; padding: 18px 30px; border-radius: 50px;
            font-size: 1.4rem; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px;
            text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }

        #nook-scanner-ui {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #7ca164; z-index: 2000; flex-direction: column; align-items: center; justify-content: center;
        }
        #nook-shell {
            width: 300px; background: #e8d595; padding: 30px; border-radius: 30px;
            box-shadow: 0 10px 0 #c4b07a;
        }
        #camera-box { width: 100%; aspect-ratio: 1/1; background: #000; border: 5px solid #5d4a37; border-radius: 15px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <div id="nook-weather"></div>

    <img id="character-img" src="https://dodo.ac/np/images/8/81/K.K._Slider_NH.png" alt="Totakeke">

    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">¡Hablar con Totakeke!</button>
    </div>

    <div id="dialog-container">
        <div id="name-tag">Totakeke</div> 
        <div id="text"></div>
        <button id="btn-proximo" onclick="terminarDialogo(event)">Continuar</button>
        <div id="arrow" style="display:none"></div>
    </div>

    <div id="nook-loading-screen">
        <img class="loading-gif" src="https://media.tenor.com/PWXsfdUcE1wAAAAi/animal-crossing-waiting.gif">
    </div>

    <div id="nook-master-menu">
        <h2 class="nook-title">¿Qué quieres hacer ahora?</h2>
        <button class="ac-btn" style="background: #84c042; box-shadow: 0 6px 0 #618e31;" onclick="iniciarEscaner(event)">📱 USAR NOOKÓFONO</button>
        <button class="ac-btn" style="background: #ff7e7e; box-shadow: 0 6px 0 #c05050;" onclick="location.reload()">🔄 REPETIR PISTA</button>
    </div>

    <div id="nook-scanner-ui">
        <h2 class="nook-title">Nookófono</h2>
        <div id="nook-shell"><div id="camera-box"><video id="nook-video" playsinline></video></div></div>
        <button class="ac-btn" style="background:#ff7e7e; margin-top:20px;" onclick="cerrarEscaner()">CANCELAR</button>
    </div>

    <audio id="voice-sound" src="totakeke.wav" loop></audio>
    <audio id="guitar-sound" src="guitarra.mp3" loop></audio>
    <audio id="global-bgm" src="pista5.mp3" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        const messages = [
            "Hey, colega... felicidades.",
            "Los 30 años son como ese vinilo que compras por la portada y acaba siendo tu disco favorito.",
            "Tienen cuerpo, tienen alma y suenan mucho mejor que los 20.",
            "He estado ajustando las cuerdas de mi guitarra para dedicarte una canción que compuse mirando las estrellas de esta isla.",
            "Canela y Mónica están terminando de colocar los altovacoces en la plaza, pero me han dado un aviso importante.",
            "Una estrella del McDonald's como tú no puede subir al escenario con ropa de diario.",
            "Pili ha montado un taller de costura de urgencia en un lugar muy especial...",
            "Busca el lugar donde guardas todas tus versiones...",
            "...ese refugio de madera donde el tejido espera su momento para salir a pasear.",
            "Allí, tras las puertas que guardan tu mejor imagen...",
            "...te espera el diseño que te hará brillar.",
            "Ve a verla, tiene algo que te va a dejar sin palabras. ¡Nos vemos en el concierto, colega!"
        ];

        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;
        const clickSnd = new Audio('./click.wav');

        function playClick() { clickSnd.currentTime = 0; clickSnd.play().catch(()=>{}); }

        function empezarJuego(event) {
            event.stopPropagation();
            playClick();
            document.getElementById("global-bgm").play();
            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            startMessage();
        }

        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].length;
                document.getElementById("text").innerHTML = messages[currentMsgIndex];
                stopVoice();
            } else if (currentMsgIndex < messages.length - 1) {
                playClick();
                currentMsgIndex++;
                startMessage();
            }
        }

        function startMessage() {
            isTyping = true; charIndex = 0;
            document.getElementById("text").innerHTML = "";
            document.getElementById("btn-proximo").style.display = "none";
            document.getElementById("arrow").style.display = "none";

            if (currentMsgIndex === 7) {
                document.body.classList.add('spotlight');
                document.getElementById("global-bgm").pause();
                document.getElementById("guitar-sound").play();
            } else if (currentMsgIndex === 11) {
                document.body.classList.remove('spotlight');
                document.getElementById("guitar-sound").pause();
                document.getElementById("guitar-sound").currentTime = 0;
                document.getElementById("global-bgm").play();
            }

            document.getElementById("voice-sound").play();
            typeWriter();
        }

        function typeWriter() {
            if (charIndex < messages[currentMsgIndex].length) {
                document.getElementById("text").innerHTML += messages[currentMsgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 50);
            } else { stopVoice(); }
        }

        function stopVoice() {
            isTyping = false;
            document.getElementById("voice-sound").pause();
            document.getElementById("voice-sound").currentTime = 0;
            if (currentMsgIndex < messages.length - 1) {
                document.getElementById("arrow").style.display = "block";
            } else {
                document.getElementById("btn-proximo").style.display = "block";
            }
        }

        function terminarDialogo(event) {
            event.stopPropagation();
            playClick();
            document.getElementById('character-img').style.opacity = '0';
            document.getElementById('dialog-container').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('nook-master-menu').style.display = 'flex';
                gameActive = false;
            }, 600);
        }

        async function iniciarEscaner(event) {
            event.stopPropagation();
            playClick();
            document.getElementById('nook-loading-screen').style.display = 'block';
            
            setTimeout(async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    document.getElementById('nook-video').srcObject = stream;
                    document.getElementById('nook-video').play();
                    document.getElementById('nook-loading-screen').style.display = 'none'; 
                    document.getElementById('nook-scanner-ui').style.display = 'flex';
                    window.scannerStream = stream;
                    requestAnimationFrame(scanTick);
                } catch (err) { alert("Error cámara"); }
            }, 3000);
        }

        function cerrarEscaner() {
            playClick();
            if(window.scannerStream) window.scannerStream.getTracks().forEach(t => t.stop());
            document.getElementById('nook-scanner-ui').style.display = 'none';
        }

        function scanTick() {
            const video = document.getElementById('nook-video');
            if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code && code.data.startsWith('http')) {
                    window.location.href = code.data;
                    return;
                }
            }
            if(document.getElementById('nook-scanner-ui').style.display === 'flex') requestAnimationFrame(scanTick);
        }

        const w = document.getElementById('nook-weather');
        for(let i=0; i<6; i++) {
            const l = document.createElement('div');
            l.className = 'leaf';
            l.style.top = Math.random()*80+'%';
            l.style.animationDuration = (Math.random()*4+4)+'s';
            l.style.animationDelay = (Math.random()*5)+'s';
            w.appendChild(l);
        }
    </script>
</body>
</html>
