<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gincana Animal Crossing - Tom Nook</title>
    <style>
        /* Importación Robusta de Seurat */
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; }

        body { 
            background: #7db9e8; 
            background-image: radial-gradient(rgba(0,0,0,0.1) 20%, transparent 20%);
            background-size: 30px 30px;
            font-family: 'Seurat', 'Arial Rounded MT Bold', sans-serif !important; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
        }

        #character-img {
            width: 65vw; 
            max-width: 280px;
            height: auto;
            z-index: 30;
            margin-bottom: -30px; 
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }

        #btn-abrir {
            background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a;
            font-family: 'Seurat', sans-serif !important;
        }

        #dialog-container {
            width: 90%; 
            max-width: 600px; 
            height: 180px; 
            background: #fffdf0; 
            border: 6px solid #f3e5ab; 
            border-radius: 40px;
            padding: 25px 30px; 
            position: relative; 
            box-shadow: 0 8px 0 #d9c9a0; 
            cursor: pointer; 
            display: none;
            z-index: 20;
        }

        #name-tag {
            position: absolute; 
            top: -20px; left: 30px; 
            background: #79a6d2; 
            color: white; 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 1.1rem;
            border: 3px solid #fff;
            z-index: 40;
            font-family: 'Seurat', sans-serif !important;
        }

        #text { 
            color: #5d4a37; 
            font-family: 'Seurat', sans-serif !important;
            font-size: clamp(1rem, 3.8vw, 1.2rem); 
            line-height: 1.3; 
            overflow: hidden;
            height: 100%;
            font-weight: bold;
        }

        #btn-reiniciar {
            display: none;
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: #79a6d2;
            border: 3px solid #fff; 
            color: white;
            padding: 8px 15px; 
            border-radius: 25px; 
            font-size: 0.9rem;
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #5a85b0;
            z-index: 50;
            font-family: 'Seurat', sans-serif !important;
        }

        #arrow { 
            position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-top: 15px solid #79a6d2; animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <img id="character-img" src="https://dodo.ac/np/images/e/e3/Tom_Nook_NH.png" alt="Tom Nook">

    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">¡Hablar con Tom Nook!</button>
    </div>

    <div id="dialog-container">
        <div id="name-tag">Tom Nook</div> 
        <div id="text"></div>
        <button id="btn-reiniciar" onclick="reiniciarGincana(event)">Reiniciar</button>
        <div id="arrow" style="display:none"></div>
    </div>

    <audio id="voice-sound" src="tomnook.wav" loop></audio>

    <script>
        const messages = [
            "¡Sí, sí! ¡Bienvenida, estimada Rocío! ¡Qué alegría verte por aquí!",
            "Como gestor y dueño de esta próspera isla, no podía faltar en un día tan señalado como tu 30 cumpleaños.",
            "Estaba justo aquí, con Minina, que está inspeccionando el terreno con mucha elegancia, supervisando los planos de este gran evento.",
            "Me ha llegado un rumor a la oficina de gestión... Dicen que estás en trámites para una nueva parcela fuera de la isla.",
            "Y que los banqueros de allí son un poco... ¿cómo decirlo?... ¡torpes! ¡Vaya desastre, sí, sí!",
            "Escucha, Rocío, si esos aficionados te dan más problemas, recuerda que en Nook Inc. siempre tenemos un contrato de hipoteca a medida esperándote.",
            "Sin intereses, sin prisas y sin bancos que se olviden de los papeles. ¡Aquí los trámites se cierran con un apretón de manos!",
            "Pero bueno, no hablemos de negocios, que hoy el plan de desarrollo es tu felicidad.",
            "Para conseguir el avituallamiento oficial de la fiesta, debes dirigirte al Almacén.",
            "Tere te espera con los botes de confeti y los preparativos listos bajo una escalera de madera.",
            "¡No olvides caminar con paso firme, sí, sí!"
        ];

        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;

        const textDiv = document.getElementById("text");
        const restartBtn = document.getElementById("btn-reiniciar");
        const arrow = document.getElementById("arrow");

        function empezarJuego(event) {
            event.stopPropagation(); 
            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            startMessage();
        }

        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].length;
                textDiv.innerHTML = messages[currentMsgIndex];
                stopVoice();
            } else {
                if (currentMsgIndex < messages.length - 1) {
                    currentMsgIndex++;
                    startMessage();
                }
            }
        }

        function startMessage() {
            isTyping = true;
            charIndex = 0;
            textDiv.innerHTML = "";
            restartBtn.style.display = "none";
            arrow.style.display = "none";
            document.getElementById("voice-sound").play();
            typeWriter();
        }

        function typeWriter() {
            if (charIndex < messages[currentMsgIndex].length) {
                textDiv.innerHTML += messages[currentMsgIndex].charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 40);
            } else {
                stopVoice();
            }
        }

        function stopVoice() {
            isTyping = false;
            document.getElementById("voice-sound").pause();
            document.getElementById("voice-sound").currentTime = 0;
            
            if (currentMsgIndex < messages.length - 1) {
                arrow.style.display = "block";
            } else {
                restartBtn.style.display = "block";
            }
        }

        function reiniciarGincana(event) {
            event.stopPropagation(); 
            currentMsgIndex = 0;
            restartBtn.style.display = "none";
            startMessage();
        }
    </script>
<audio id="global-bgm" src="pista3.mp3" loop></audio>

<script>
    (function() {
        const bgm = document.getElementById('global-bgm');
        bgm.volume = 0.3; // Volumen de la música de fondo (0.0 a 1.0)

        // Función para iniciar la música con el primer clic del usuario (exigencia de navegadores)
        document.addEventListener('click', () => {
            if (bgm.paused) bgm.play();
        }, { once: true });

        // Monitor de audios
        setInterval(() => {
            const allAudios = document.querySelectorAll('audio:not(#global-bgm)');
            let specialAudioPlaying = false;

            allAudios.forEach(audio => {
                // Si el audio está sonando y NO es el balbuceo (animalese/voice)
                // Ajusta los nombres de archivo según tus .wav
                const isAnimalese = audio.src.includes('animalese') || 
                                    audio.id.includes('voice') || 
                                    audio.src.includes('gandulio.wav') || 
                                    audio.src.includes('encina.wav');

                if (!audio.paused && !isAnimalese) {
                    specialAudioPlaying = true;
                }
            });

            if (specialAudioPlaying) {
                // Si suena algo importante (música de misterio, etc), pausamos el fondo
                if (!bgm.paused) {
                    bgm.pause();
                }
            } else {
                // Si no hay audios especiales, el fondo sigue sonando
                if (bgm.paused && document.getElementById('overlay').style.display === 'none') {
                    bgm.play();
                }
            }
        }, 300); // Revisa cada 300ms
    })();
</script>
</body>
</html>
