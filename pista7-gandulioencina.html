<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gincana Animal Crossing - Gandulio y Encina</title>
    <style>
        @font-face {
            font-family: 'Seurat';
            src: url('https://cdn.jsdelivr.net/gh/clshortfuse/animal-crossing-font/font.woff2') format('woff2');
            font-weight: bold;
        }

        * { box-sizing: border-box; }

        body { 
            background: #cbd58d; 
            background-image: radial-gradient(rgba(255,255,255,0.4) 15%, transparent 20%);
            background-size: 40px 40px;
            font-family: 'Seurat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center;
            height: 100dvh; 
            margin: 0; 
            overflow: hidden; 
            padding-bottom: 5vh;
            transition: background 1s ease;
        }

        /* CAPA DE HOJAS */
        #nook-weather { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
        .leaf { 
            position: absolute; width: 15px; height: 10px; 
            background: #a3d977; border-radius: 10px 2px; opacity: 0.8; 
            animation: leafFall linear infinite; 
        }
        @keyframes leafFall { 0% { transform: translate(-20px, 0) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translate(110vw, 50vh) rotate(720deg); opacity: 0; } }

        /* PARTÍCULAS MÁGICAS ORIGINALES */
        #magic-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10; display: none;
        }
        .sparkle {
            position: absolute; background: white; border-radius: 50%;
            filter: blur(1px); box-shadow: 0 0 10px white;
            animation: flash var(--d) infinite ease-in-out;
        }
        @keyframes flash { 0%, 100% { opacity: 0; transform: scale(0); } 50% { opacity: 1; transform: scale(1); } }

        /* CONTENEDOR PERSONAJE FIJO */
        .char-container {
            height: 280px; display: flex; align-items: flex-end; z-index: 30; margin-bottom: -30px; margin-left: 40px;
        }
        #character-img {
            width: 70vw; max-width: 300px; height: auto;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
            pointer-events: none; transition: opacity 0.3s ease, filter 1s ease;
        }

        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; justify-content: center;
            align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }

        #btn-abrir {
            background: #fdfae5; border: 6px solid #e8d595; color: #5d4a37;
            padding: 15px 30px; border-radius: 50px; font-size: 1.5rem;
            font-weight: bold; cursor: pointer; box-shadow: 0 8px 0 #c4b07a;
            font-family: 'Seurat', sans-serif;
        }

        #dialog-container {
            width: 90%; max-width: 600px; height: 190px; 
            background: #fffdf0; border: 6px solid #f3e5ab; border-radius: 40px;
            padding: 25px 30px; position: relative; box-shadow: 0 8px 0 #d9c9a0; 
            cursor: pointer; display: none; z-index: 20;
        }

        #name-tag {
            position: absolute; top: -20px; left: 30px; 
            color: white; padding: 8px 20px; border-radius: 20px; 
            font-weight: bold; font-size: 1.1rem; border: 3px solid #fff; z-index: 100;
        }

        #text { color: #5d4a37; font-weight: bold; font-size: clamp(1.1rem, 4vw, 1.3rem); line-height: 1.3; white-space: pre-line; }

        #arrow { 
            position: absolute; bottom: 20px; right: 30px; width: 0; height: 0; 
            border-left: 10px solid transparent; border-right: 10px solid transparent; 
            border-top: 15px solid #78a45c; animation: bounce 0.6s infinite alternate;
        }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(5px); } }

        /* ESTILOS NOOK */
        .nook-title { color: white; text-align: center; font-size: 2.2rem; -webkit-text-stroke: 8px #4b633a; paint-order: stroke fill; margin-bottom: 20px; }
        #nook-loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #05070a; z-index: 5000; display: none; }
        .loading-gif { position: absolute; bottom: 30px; right: 30px; width: 80px; }
        #nook-master-menu { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; flex-direction: column; gap: 20px; align-items: center; z-index: 1000; width: 90%; }
        .ac-btn { border: 4px solid #fff; color: white; padding: 18px 30px; border-radius: 50px; font-size: 1.4rem; font-weight: bold; cursor: pointer; width: 100%; max-width: 300px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
        #nook-scanner-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #7ca164; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        #nook-shell { width: 300px; background: #e8d595; padding: 30px; border-radius: 30px; box-shadow: 0 10px 0 #c4b07a; }
        #camera-box { width: 100%; aspect-ratio: 1/1; background: #000; border: 5px solid #5d4a37; border-radius: 15px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body onclick="handleGlobalClick()">

    <div id="nook-weather"></div>
    <div id="magic-particles"></div>

    <div class="char-container">
        <img id="character-img" src="https://dodo.ac/np/images/5/5f/Leif_LINE_Animated_Sticker.png" alt="Personaje">
    </div>

    <div id="overlay">
        <button id="btn-abrir" onclick="empezarJuego(event)">Rincon de relax de Gandulio y Encina.</button>
    </div>

    <div id="dialog-container">
        <div id="name-tag">Gandulio</div> 
        <div id="text"></div>
        <div id="arrow" style="display:none"></div>
    </div>

    <div id="nook-loading-screen">
        <img class="loading-gif" src="https://media.tenor.com/PWXsfdUcE1wAAAAi/animal-crossing-waiting.gif">
    </div>

    <div id="nook-master-menu">
        <h2 class="nook-title">¿Qué quieres hacer ahora?</h2>
        <button class="ac-btn" style="background: #84c042; box-shadow: 0 6px 0 #618e31;" onclick="iniciarEscaner(event)">📱 USAR NOOKÓFONO</button>
        <button class="ac-btn" style="background: #ff7e7e; box-shadow: 0 6px 0 #c05050;" onclick="location.reload()">🔄 REPETIR PISTA</button>
    </div>

    <div id="nook-scanner-ui">
        <h2 class="nook-title">Nookófono</h2>
        <div id="nook-shell"><div id="camera-box"><video id="nook-video" playsinline></video></div></div>
        <button class="ac-btn" style="background:#ff7e7e; margin-top:20px;" onclick="cerrarEscaner()">CANCELAR</button>
    </div>

    <audio id="voice-gandulio" src="gandulio.wav" loop></audio>
    <audio id="voice-encina" src="encina.wav" loop></audio>
    <audio id="click-snd" src="./click.wav"></audio>
    <audio id="magic-music" src="Hypno K.K..mp3" loop></audio>
    <audio id="global-bgm" src="pista7.mp3" loop></audio>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        // URLs Originales de Pista 7
        const imgGandulio = "https://dodo.ac/np/images/1/1c/Leif_NH.png";
        const imgEncina = "https://dodo.ac/np/images/c/c4/Poppy_NH.png";

        const messages = [
            { char: "Gandulio", text: "¡Holaaaa! ¡Pero qué salado que hayas venido a vernos! ¡Feliz cumpleaños! 🌿" },
            { char: "Gandulio", text: "Estaba aquí mismo susurrándoles cosas bonitas a mis brotes de azalea para que crezcan con mucha fuerza hoy..." },
            { char: "Gandulio", text: "He preparado un poco de zumo de bayas y he traído estas flores para que tu día huela como un jardín." },
            { char: "Gandulio", text: "Me daría mucha pereza moverme ahora... se está tan a gusto que mis plantas y yo nos vamos a quedar aquí echando raíces. 💤" },
            { char: "Encina", text: "¡Oh, ¡calabacitas!, muchísimas felicidades! 🎀" },
            { char: "Encina", text: "He estado consultando mis enciclopedias, nutinú, y dicen que a los 30 años una persona florece igual de bien que los híbridos. 📖" },
            { char: "Encina", text: "¡Él casi se queda frito mientras preparaba el refrigerio! ¡Ese conjunto de Pili te sienta de maravilla, terroncito!" },
            { char: "Gandulio", text: "Es verdad, oye... qué salado te queda. Ya tienes el transporte, el confeti, el concierto y el estilazo." },
            { char: "Gandulio", text: "Pero para encontrar el final, vas a tener que pensar un poco, saleroso... escucha bien:" },
            { char: "Gandulio", text: "Busca el lugar donde la charla fluye,\ny el cansancio del día siempre se diluye.", magic: true },
            { char: "Gandulio", text: "Bajo lo que ves, hay otra realidad,\ndonde dados y fichas guardan su verdad.", magic: true },
            { char: "Gandulio", text: "No es bosque ni playa, pero hay mucha madera,\ndonde el hambre se calma y la tarta te espera.", magic: true },
            { char: "Gandulio", text: "Si exploras el fondo que el azar domina...\n¡hallarás la sorpresa del gran Azulino!", magic: true },
            { char: "Encina", text: "¡Calabacitas!, ¡estoy tan emocionada que me tiemblan hasta las orejas, nutinú! 🐿️" },
            { char: "Encina", text: "¡Corre, corre! ¡Sigue la pista antes de que el misterio se resuelva solo! ¡Va a ser un momento ideal! 🏃‍♀️💨" }
        ];

        let currentMsgIndex = 0;
        let charIndex = 0;
        let isTyping = false;
        let gameActive = false;

        function playClick() { const s = document.getElementById("click-snd"); s.currentTime = 0; s.play().catch(()=>{}); }

        function createSparkles() {
            const container = document.getElementById("magic-particles");
            container.innerHTML = '';
            for(let i=0; i<30; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                const size = Math.random() * 5 + 2;
                s.style.width = size + 'px'; s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
                s.style.setProperty('--d', (Math.random() * 2 + 1) + 's');
                container.appendChild(s);
            }
        }

        function updateCharacter() {
            const currentObj = messages[currentMsgIndex];
            const nameTag = document.getElementById("name-tag");
            const charImg = document.getElementById("character-img");
            const particles = document.getElementById("magic-particles");
            const magicMusic = document.getElementById("magic-music");
            const bgm = document.getElementById("global-bgm");

            // Evento Mágico Original (Música e iluminación)
            if (currentObj.magic) {
                document.body.style.background = "#2a1b3d"; 
                document.body.style.backgroundImage = "radial-gradient(rgba(138, 43, 226, 0.4) 15%, transparent 20%)";
                charImg.style.filter = "drop-shadow(0 0 20px rgba(191, 123, 255, 0.8)) brightness(1.2)";
                particles.style.display = "block";
                if(particles.children.length === 0) createSparkles();
                bgm.pause();
                if(magicMusic.paused) magicMusic.play();
            } else {
                document.body.style.background = "#cbd58d";
                document.body.style.backgroundImage = "radial-gradient(rgba(255,255,255,0.4) 15%, transparent 20%)";
                charImg.style.filter = "drop-shadow(0 5px 15px rgba(0,0,0,0.1))";
                particles.style.display = "none";
                magicMusic.pause();
                if(gameActive && bgm.paused) bgm.play();
            }

            const targetImg = currentObj.char === "Gandulio" ? imgGandulio : imgEncina;
            if (charImg.src !== targetImg) {
                charImg.style.opacity = "0";
                setTimeout(() => { charImg.src = targetImg; charImg.style.opacity = "1"; }, 100);
            }

            nameTag.innerHTML = currentObj.char;
            nameTag.style.background = currentObj.char === "Gandulio" ? "#78a45c" : "#d35b3e";
            document.getElementById("arrow").style.borderTopColor = currentObj.char === "Gandulio" ? "#78a45c" : "#d35b3e";
        }

        function handleGlobalClick() {
            if (!gameActive) return;
            if (isTyping) {
                charIndex = messages[currentMsgIndex].text.length;
                document.getElementById("text").innerHTML = messages[currentMsgIndex].text;
                stopVoice();
            } else if (currentMsgIndex < messages.length - 1) {
                playClick();
                currentMsgIndex++;
                updateCharacter();
                startMessage();
            } else {
                mostrarMenuFinal();
            }
        }

        function startMessage() {
            isTyping = true; charIndex = 0;
            document.getElementById("text").innerHTML = "";
            document.getElementById("arrow").style.display = "none";
            const currentObj = messages[currentMsgIndex];
            if (currentObj.char === "Gandulio") document.getElementById("voice-gandulio").play();
            else document.getElementById("voice-encina").play();
            typeWriter();
        }

        function typeWriter() {
            const currentText = messages[currentMsgIndex].text;
            if (charIndex < currentText.length) {
                document.getElementById("text").innerHTML += currentText.charAt(charIndex);
                charIndex++;
                let speed = (messages[currentMsgIndex].char === "Gandulio") ? 60 : 35;
                setTimeout(typeWriter, speed);
            } else { stopVoice(); }
        }

        function stopVoice() {
            isTyping = false;
            document.getElementById("voice-gandulio").pause(); document.getElementById("voice-gandulio").currentTime = 0;
            document.getElementById("voice-encina").pause(); document.getElementById("voice-encina").currentTime = 0;
            document.getElementById("arrow").style.display = "block";
        }

        function empezarJuego(event) {
            event.stopPropagation();
            playClick();
            document.getElementById("overlay").style.display = "none";
            document.getElementById("dialog-container").style.display = "block";
            gameActive = true;
            updateCharacter();
            startMessage();
        }

        function mostrarMenuFinal() {
            playClick();
            document.getElementById('dialog-container').style.display = 'none';
            document.getElementById('nook-master-menu').style.display = 'flex';
            document.querySelector('.char-container').style.opacity = '0';
            gameActive = false;
        }

        // NOOKÓFONO LOGIC
        async function iniciarEscaner() {
            playClick();
            document.getElementById('nook-loading-screen').style.display = 'block';
            setTimeout(async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                    document.getElementById('nook-video').srcObject = stream;
                    document.getElementById('nook-video').play();
                    document.getElementById('nook-loading-screen').style.display = 'none'; 
                    document.getElementById('nook-scanner-ui').style.display = 'flex';
                    window.scannerStream = stream;
                    requestAnimationFrame(scanTick);
                } catch (err) { alert("Error cámara"); }
            }, 3000);
        }

        function cerrarEscaner() {
            playClick();
            if(window.scannerStream) window.scannerStream.getTracks().forEach(t => t.stop());
            document.getElementById('nook-scanner-ui').style.display = 'none';
        }

        function scanTick() {
            const v = document.getElementById('nook-video');
            if (v && v.readyState === v.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement("canvas");
                canvas.width = v.videoWidth; canvas.height = v.videoHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
                const code = jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code && code.data.startsWith('http')) { window.location.href = code.data; return; }
            }
            if(document.getElementById('nook-scanner-ui').style.display === 'flex') requestAnimationFrame(scanTick);
        }

        // Hojas
        const w = document.getElementById('nook-weather');
        for(let i=0; i<6; i++) {
            const l = document.createElement('div');
            l.className = 'leaf';
            l.style.top = Math.random()*80+'%';
            l.style.animationDuration = (Math.random()*4+4)+'s';
            l.style.animationDelay = (Math.random()*5)+'s';
            w.appendChild(l);
        }
    </script>
</body>

</html>
